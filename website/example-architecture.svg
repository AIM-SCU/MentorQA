<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder architecture diagram</title>
  <desc id="desc">Four placeholder stages connected from input to output.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#ecefff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5369d8"/>
      <stop offset="1" stop-color="#39a39c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8790ac"/>
    </marker>
  </defs>
  <rect width="760" height="360" rx="24" fill="url(#panel)"/>
  <path d="M165 180H225M365 180H425M565 180H625" stroke="#8790ac" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g>
      <rect x="35" y="118" width="130" height="124" rx="18" fill="#fff" stroke="#dce1f4" stroke-width="2"/>
      <rect x="70" y="145" width="60" height="44" rx="7" fill="#e9edff"/>
      <path d="M83 158h34M83 167h34M83 176h22" stroke="#5369d8" stroke-width="3" stroke-linecap="round"/>
      <text x="100" y="218" fill="#27304a" font-size="15" font-weight="700">Input</text>
    </g>
    <g>
      <rect x="235" y="118" width="130" height="124" rx="18" fill="#fff" stroke="#dce1f4" stroke-width="2"/>
      <circle cx="300" cy="165" r="24" fill="#e8f5f3"/>
      <circle cx="295" cy="160" r="10" fill="none" stroke="#39a39c" stroke-width="4"/>
      <path d="m303 168 10 10" stroke="#39a39c" stroke-width="4" stroke-linecap="round"/>
      <text x="300" y="218" fill="#27304a" font-size="15" font-weight="700">Stage A</text>
    </g>
    <g>
      <rect x="435" y="118" width="130" height="124" rx="18" fill="#fff" stroke="#dce1f4" stroke-width="2"/>
      <circle cx="500" cy="165" r="25" fill="#f1edff"/>
      <path d="M487 166c0-10 7-18 16-18 8 0 15 6 15 14 0 7-5 11-10 14-4 2-6 5-6 9M502 192v1" fill="none" stroke="#7560d8" stroke-width="4" stroke-linecap="round"/>
      <text x="500" y="218" fill="#27304a" font-size="15" font-weight="700">Stage B</text>
    </g>
    <g>
      <rect x="635" y="118" width="90" height="124" rx="18" fill="#fff" stroke="#dce1f4" stroke-width="2"/>
      <circle cx="680" cy="165" r="25" fill="url(#accent)"/>
      <path d="m668 165 8 8 17-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="680" y="218" fill="#27304a" font-size="15" font-weight="700">Output</text>
    </g>
  </g>
</svg>
